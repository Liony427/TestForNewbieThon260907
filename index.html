<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta charset="utf-8" />

    <link rel="stylesheet" href="globals.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="screen">

    <img class="image" src="img/image-19.png" />

    <!-- 로그인 전체 박스 -->
    <div class="rectangle"></div>

    <!-- 로고 -->
    <div class="text-wrapper">Wallet Panic</div>


    <!-- ID -->
    <label class="text-wrapper-2" for="userId">
        ID
    </label>

    <input
        class="login-input id-input"
        id="userId"
        type="text"
        placeholder="Enter Your ID"
        autocomplete="username"
    >


    <!-- PASSWORD -->
    <label class="text-wrapper-4" for="userPassword">
        PASSWORD
    </label>

    <input
        class="login-input password-input"
        id="userPassword"
        type="password"
        placeholder="Enter Your Password"
        autocomplete="current-password"
    >


    <!-- 로그인 버튼 -->
    <button
        class="sign-in-button"
        id="signInBtn"
        type="button"
    >
        Sign In
    </button>


    <!-- 회원가입 -->
    <p class="don-t-have-an">

        <span class="span">
            Don’t have an account?
        </span>

        <a
            class="text-wrapper-6"
            id="signUpLink"
            href="#"
        >
            Sign Up!
        </a>

    </p>

</div>


<script src="script.js"></script>

</body>
</html>
